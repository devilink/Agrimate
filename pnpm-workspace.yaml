packages:
  - apps/*
  - packages/*
allowBuilds:
  '@scarf/scarf': false
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  '@embedded-postgres/windows-x64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/darwin-arm64': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true
networkConcurrency: 6
fetchRetries: 5
