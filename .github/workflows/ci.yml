name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # Version comes from packageManager in package.json.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @agrimate/shared test
      - run: pnpm --filter @agrimate/api test # Starts its own temporary Postgres.
      - name: Mobile logic tests
        run: |
          node --experimental-strip-types --test apps/app-inspector/scripts/grading.test.mts
          node --experimental-strip-types --test apps/app-logistics/scripts/queue-engine.test.mts
