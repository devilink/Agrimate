name: agrimate
# Providers default to their mock adapters (see .env.example). The database is hosted on Supabase, not here.
services:
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: ['redisdata:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    # The official minio/minio images are no longer anonymously pullable; Chainguard's build is the same server.
    image: cgr.dev/chainguard/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: agrimate
      MINIO_ROOT_PASSWORD: agrimate-secret
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']

volumes:
  redisdata:
  miniodata:
